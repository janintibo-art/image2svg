name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip \
            autoconf libtool pkg-config zlib1g-dev libncurses-dev \
            libtinfo6 cmake libffi-dev libssl-dev build-essential ccache

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install buildozer cython==0.29.36

      - name: Cache buildozer
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            android/.buildozer
          key: buildozer-${{ hashFiles('android/buildozer.spec') }}

      - name: Build APK
        working-directory: android
        run: |
          export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
          buildozer -v android debug

      - name: Rename APK
        run: |
          mkdir -p out
          cp android/bin/*.apk out/Image2SVG.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Image2SVG-Android-APK
          path: out/Image2SVG.apk

      - name: Add APK to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-${{ github.run_number }}
          name: Image2SVG APK ${{ github.run_number }}
          files: out/Image2SVG.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
