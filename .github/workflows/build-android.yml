name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fix ownership for container
        run: sudo chown -R 1000:1000 android

      - name: Build APK in Kivy container
        run: |
          set -o pipefail
          docker run --rm \
            -v "${{ github.workspace }}/android":/home/user/hostcwd \
            --entrypoint /bin/bash \
            kivy/buildozer -c "buildozer -v android debug" 2>&1 | tee build.log
        continue-on-error: true

      - name: Extract errors from log
        if: always()
        run: |
          echo "=============== ERREURS ==============="
          grep -n -i -E "error|failed|traceback|No such file|not found" build.log | tail -n 40 || true
          echo "=============== 60 DERNIERES LIGNES ==============="
          tail -n 60 build.log || true

      - name: Upload full log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Collect APK
        run: |
          sudo chown -R $(id -u):$(id -g) android
          mkdir -p out
          cp android/bin/*.apk out/Image2SVG.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Image2SVG-Android-APK
          path: out/Image2SVG.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: android-${{ github.run_number }}
          name: Image2SVG APK ${{ github.run_number }}
          files: out/Image2SVG.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
